name: Deploy frontend to OCI

on:
  push:
    branches:
      - dev
  workflow_dispatch:

concurrency:
  group: deploy-frontend-oci-dev
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      OCI_HOST: ${{ secrets.OCI_HOST }}
      OCI_USER: ${{ secrets.OCI_USER }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Build static frontend
        env:
          STATIC_EXPORT: 'true'
        run: |
          npm ci
          npm run build

      - name: Configure SSH
        shell: bash
        env:
          OCI_SSH_PRIVATE_KEY: ${{ secrets.OCI_SSH_PRIVATE_KEY }}
        run: |
          test -n "$OCI_HOST"
          test -n "$OCI_USER"
          test -n "$OCI_SSH_PRIVATE_KEY"
          install -m 700 -d ~/.ssh
          printf '%s\n' "$OCI_SSH_PRIVATE_KEY" > ~/.ssh/oci
          chmod 600 ~/.ssh/oci
          ssh-keyscan -H "$OCI_HOST" >> ~/.ssh/known_hosts

      - name: Replace deployed frontend
        shell: bash
        run: |
          ssh -i ~/.ssh/oci "$OCI_USER@$OCI_HOST" \
            'mkdir -p ~/tri-read/frontend/out && find ~/tri-read/frontend/out -mindepth 1 -maxdepth 1 -exec rm -rf -- {} +'
          scp -i ~/.ssh/oci -r out/. \
            "$OCI_USER@$OCI_HOST:~/tri-read/frontend/out/"

      - name: Verify public page
        shell: bash
        run: >-
          curl --fail --retry 10 --retry-all-errors --retry-delay 5
          "https://tri-read.${OCI_HOST}.sslip.io/"
